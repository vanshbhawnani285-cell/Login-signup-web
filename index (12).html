<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            height: 15%;
            margin-top: 25px;
        }
        .box{
            height: 700px;
            background:linear-gradient(90deg,skyblue,violet);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        form{
            height: 70%;
            width: 30%;
            background-color: white;
            border-radius: 5px;
            text-transform: capitalize;
        }
        label{
            width: 80%;
            /* border: 1px solid black; */
        }
        input{
            height:50%;
            width: 90%;
            border: 1px solid black;
            border-radius: 10px; 
            margin-top: 3%;
        }
        .login,.password,.email{
            width: 80%;
            /* border: 1px solid black; */
            margin:auto;
            height: 20%;
            display: flex;
            flex-direction: column;
            column-gap:20px;
        }
        #login{
            background: linear-gradient(90deg,skyblue,violet);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10%;
            border: none;
            color: white;
            border-radius: 10px;
        }
        .password>p{
            color: gray;
        }
        .login>p{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
    <form action="">
        <h1 align="center">Login Form</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="text" placeholder="xyz@gmail.com">
        </div>
        <div class="password">
            <label for="">Password</label>
            <input type="password"placeholder="Abcd@1234">
            <p>Forgot Password?</p>
        </div>
        <div class="login">
            <input type="button" value="LOGIN" id="login">
            <p>Not a Member? <a href="signup.html">Sign Up</a></p>
            <p></p>     
        </div>
    </form>
    </div>
</body>
</html>
